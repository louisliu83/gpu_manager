# slurm.conf - Slurm Main Configuration
# 基础集群设置
ClusterName=gpu-cluster
ControlMachine=YOUR_CONTROLLER_IP        # 重要: 替换为实际 IP 或主机名
ControlAddr=YOUR_CONTROLLER_IP
AuthType=auth/munge
CryptoType=crypto/munge
MungeCredExpiration=360
SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818
SlurmctldHost=YOUR_CONTROLLER_IP

# 状态保存路径
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

# 调度器配置
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory,CR_Core
PriorityType=priority/basic
JobSubmitPlugins=lua

# 计时与清理设置
ReturnToService=2
MinJobAge=300
PropagateResourceLimits=ALL

# 通用资源与分区配置
GresTypes=gpu
NodeName=localhost CPUs=4 RealMemory=16384 State=UNKNOWN
PartitionName=debug Nodes=localhost Default=YES MaxTime=INFINITE State=UP
# 其他分区（供云实例使用）示例：
# PartitionName=autodl Nodes=ALL Default=NO MaxTime=INFINITE State=UP
# PartitionName=ppio Nodes=ALL Default=NO MaxTime=INFINITE State=UP
# PartitionName=luchen Nodes=ALL Default=NO MaxTime=INFINITE State=UP
