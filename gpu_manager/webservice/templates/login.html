<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GPU 调度平台 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1e293b;
            padding: 40px 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
        }
        .logo h2 {
            color: #f1f5f9;
            font-size: 22px;
        }
        .logo p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 6px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            font-size: 14px;
            color: #f1f5f9;
        }
        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }
        .login-btn:hover {
            background: #2563eb;
        }
        .error-msg {
            background: rgba(239,68,68,0.15);
            border-radius: 10px;
            padding: 10px;
            margin-top: 16px;
            font-size: 13px;
            color: #f87171;
            text-align: center;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <h2>GPU 调度平台</h2>
            <p>多云算力 · 统一调度</p >
        </div>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="密码">
            </div>
            <button type="submit" class="login-btn">登 录</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>
    <script>
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!username || !password) {
                errorMsg.textContent = '请输入用户名和密码';
                errorMsg.classList.add('show');
                return;
            }
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.error || '登录失败';
                    errorMsg.classList.add('show');
                    setTimeout(() => errorMsg.classList.remove('show'), 3000);
                }
            } catch (err) {
                errorMsg.textContent = '网络错误';
                errorMsg.classList.add('show');
            }
        });
    </script>
</body>
</html>
